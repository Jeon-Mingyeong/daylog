services:
  - type: web
    name: daylog-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DAYLOG_CORS_ORIGINS
        value: https://jeon-mingyeong.github.io
